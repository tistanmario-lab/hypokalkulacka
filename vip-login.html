<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Zóna | Prihlásenie | Mário Tišťan</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  /* Partners — základná farebnosť */
  --red:#AB0534;--red-light:#CD6D80;--red-dark:#8F042C;--silver:#989FA7;--gray:#4D4D4D;--sand:#ECEDED;--white:#fff;
  /* doplnková — len zvýraznenie */
  --c-yellow:#FFF3B0;--c-green:#CBD9C4;
  --muted:rgba(77,77,77,0.68);--border:rgba(77,77,77,0.14);--radius:20px;
}
/* Graphik — brandové písmo Partners, z počítača (súbor fontu sa nezverejňuje); fallback Arial */
@font-face{font-family:'Graphik';src:local('Graphik-Regular'),local('Graphik Regular');font-weight:400;font-style:normal;}
@font-face{font-family:'Graphik';src:local('Graphik-Medium'),local('Graphik Medium');font-weight:500;font-style:normal;}
@font-face{font-family:'Graphik';src:local('Graphik-Semibold'),local('Graphik Semibold');font-weight:600 800;font-style:normal;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Graphik',Arial,Helvetica,sans-serif;background:var(--sand);color:var(--gray);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;}
.login-container{width:100%;max-width:420px;padding:20px;}
.login-card{background:var(--white);border-radius:var(--radius);padding:44px 40px 40px;box-shadow:0 16px 48px rgba(77,77,77,0.08);text-align:center;}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:30px;text-decoration:none;color:var(--gray);}
.login-brand img{height:22px;width:auto;display:block;}
.login-brand-name{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;letter-spacing:-.005em;}
.login-badge{background:var(--red);color:#fff;font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:12px;}
.login-title{font-size:22px;font-weight:600;letter-spacing:-.012em;margin-bottom:8px;}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.input-group{margin-bottom:16px;text-align:left;}
.input-group label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.input-group input{width:100%;padding:14px 16px;font-size:15px;font-family:inherit;border:1px solid var(--border);border-radius:12px;background:var(--sand);color:var(--gray);outline:none;transition:border-color .2s;}
.input-group input:focus{border-color:var(--red);}
.login-btn{width:100%;padding:16px;background:var(--red);color:#fff;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:none;border-radius:12px;cursor:pointer;transition:background .2s;margin-top:8px;}
.login-btn:hover{background:var(--red-dark);}
.login-error{display:none;color:var(--red);font-size:13px;font-weight:500;margin-top:12px;}
.login-ok{display:none;color:var(--gray);background:rgba(203,217,196,0.55);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:500;margin-top:12px;}
.login-footer{margin-top:24px;font-size:12px;color:var(--silver);}
.login-footer a{color:var(--gray);text-decoration:none;font-weight:500;}
.login-footer a:hover{color:var(--red);}
.login-link{background:none;border:none;color:var(--gray);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;text-decoration:underline;padding:0;margin-top:14px;}
.login-link:hover{color:var(--red);}
@media (max-width:480px){.login-card{padding:36px 24px;}.input-group input{padding:14px 16px;font-size:16px;min-height:48px;}.login-btn{padding:14px;min-height:48px;}}
</style>
<script src="supabase.min.js"></script>
<script src="vip-cloud.js"></script>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <a href="index.html" class="login-brand"><img src="img/partners-logo-red.png" alt="Partners"><span class="login-brand-name">Mário Tišťan <span class="login-badge">VIP Zóna</span></span></a>

    <h1 class="login-title">Prihlásenie</h1>
    <p class="login-sub">Prístup len pre autorizovaných členov tímu.</p>

    <form onsubmit="event.preventDefault(); doLogin(); return false;">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="vas@email.sk" autocomplete="username" autofocus required>
      </div>
      <div class="input-group">
        <label for="password">Heslo</label>
        <input type="password" id="password" placeholder="Zadajte heslo" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn">Prihlásiť sa</button>
    </form>

    <div class="login-error" id="loginError">Nesprávne meno alebo heslo.</div>
    <div class="login-ok" id="loginOk"></div>

    <button type="button" class="login-link" onclick="resetPassword()">Zabudnuté heslo?</button>

    <div class="login-footer">
      <a href="index.html">&larr; Späť na hlavnú stránku</a>
    </div>
  </div>
</div>

<script>
// Prihlásenie cez Supabase (e-mail + heslo)
var loginBusy = false;

async function doLogin() {
  if (loginBusy) return false;
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.querySelector('.login-btn');
  var errEl = document.getElementById('loginError');
  var okEl = document.getElementById('loginOk');
  errEl.style.display = 'none';
  okEl.style.display = 'none';

  if (!window.sbc) {
    errEl.textContent = 'Spojenie s cloudom sa nenačítalo. Skontrolujte internet a obnovte stránku.';
    errEl.style.display = 'block';
    return false;
  }

  loginBusy = true;
  btn.disabled = true; btn.style.opacity = '0.6'; btn.style.cursor = 'wait';
  var originalText = btn.textContent;
  btn.textContent = 'Prihlasujem…';

  try {
    var res = await window.sbc.auth.signInWithPassword({ email: email, password: password });
    if (res.error) {
      var m = (res.error.message || '').toLowerCase();
      if (m.indexOf('not confirmed') > -1 || m.indexOf('confirm') > -1) {
        errEl.textContent = 'Účet ešte nie je potvrdený. Skontrolujte e-mail s potvrdením, alebo požiadajte správcu o potvrdenie účtu.';
      } else if (m.indexOf('invalid login') > -1 || m.indexOf('credentials') > -1) {
        errEl.textContent = 'Nesprávny e-mail alebo heslo.';
      } else {
        errEl.textContent = 'Prihlásenie zlyhalo: ' + res.error.message;
      }
      errEl.style.display = 'block';
      document.getElementById('password').value = '';
    } else {
      window.location.href = 'vip-dashboard.html';
      return false;
    }
  } catch(e) {
    errEl.textContent = 'Chyba pri prihlasovaní: ' + (e.message || e);
    errEl.style.display = 'block';
  } finally {
    loginBusy = false;
    btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = '';
    btn.textContent = originalText;
  }
  return false;
}

// Obnova hesla — pošle e-mail s odkazom na nastavenie nového hesla
async function resetPassword() {
  var email = document.getElementById('email').value.trim();
  var errEl = document.getElementById('loginError');
  var okEl = document.getElementById('loginOk');
  errEl.style.display = 'none';
  okEl.style.display = 'none';
  if (!email) {
    errEl.textContent = 'Najprv zadajte svoj e-mail, potom kliknite na „Zabudnuté heslo".';
    errEl.style.display = 'block';
    return;
  }
  if (!window.sbc) return;
  try {
    var redirectTo = window.location.origin + '/vip-reset.html';
    var res = await window.sbc.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });
    if (res.error) {
      errEl.textContent = 'Nepodarilo sa odoslať e-mail: ' + res.error.message;
      errEl.style.display = 'block';
    } else {
      okEl.textContent = 'Odoslali sme vám e-mail s odkazom na obnovu hesla.';
      okEl.style.display = 'block';
    }
  } catch(e) {
    errEl.textContent = 'Chyba: ' + (e.message || e);
    errEl.style.display = 'block';
  }
}

// Ak je používateľ platne prihlásený, presmeruj na dashboard.
// DÔLEŽITÉ: reláciu overíme so serverom (getUser). Ak je zastaraná/neplatná
// (napr. po zmazaní účtu), odhlásime ju a zostaneme na login — tým sa preruší
// prípadná slučka presmerovaní (blikanie stránky).
(async function(){
  try {
    if (!window.sbc) return;
    // Počkaj na hydratáciu relácie (beží na pozadí, formulár je hneď použiteľný).
    var sess = await vipResolveSession(2500);
    if (!sess) return; // odhlásený → zostaň na prihlásení
    var u = await window.sbc.auth.getUser(); // over reláciu so serverom
    if (u && !u.error && u.data && u.data.user) {
      window.location.replace('vip-dashboard.html'); // platná relácia
    } else {
      try { await window.sbc.auth.signOut(); } catch(e) {} // neplatná → vyčisti
    }
  } catch(e) { /* sieťová chyba → zostaň na login */ }
})();
</script>

</body>
</html>
