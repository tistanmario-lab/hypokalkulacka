<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Zóna | Prihlásenie | Mário Tišťan</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #003049;
  --red: #AB0534;
  --silver: #989FA7;
  --sand: #ECEDED;
  --white: #ffffff;
  --muted: rgba(0,48,73,0.5);
  --border: rgba(0,48,73,0.1);
  --radius: 20px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--sand); color: var(--navy); min-height: 100vh; display: flex; align-items: center; justify-content: center; }

.login-container {
  width: 100%;
  max-width: 420px;
  padding: 20px;
}

.login-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 48px 40px;
  box-shadow: 0 16px 48px rgba(0,48,73,0.08);
  text-align: center;
}

.login-logo {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--navy);
  text-decoration: none;
  margin-bottom: 8px;
  display: block;
}
.login-logo span { color: var(--red); }

.login-badge {
  display: inline-block;
  background: var(--navy);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 4px 14px;
  border-radius: 20px;
  margin-bottom: 32px;
}

.login-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}

.login-sub {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 32px;
  line-height: 1.6;
}

.input-group {
  margin-bottom: 16px;
  text-align: left;
}

.input-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--sand);
  color: var(--navy);
  outline: none;
  transition: border-color .2s;
}

.input-group input:focus {
  border-color: var(--navy);
}

.login-btn {
  width: 100%;
  padding: 16px;
  background: var(--red);
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: background .2s;
  margin-top: 8px;
}

.login-btn:hover { background: var(--navy); }

.login-error {
  display: none;
  color: var(--red);
  font-size: 13px;
  font-weight: 500;
  margin-top: 12px;
}

.login-footer {
  margin-top: 24px;
  font-size: 12px;
  color: var(--silver);
}

.login-footer a {
  color: var(--navy);
  text-decoration: none;
  font-weight: 500;
}

.login-footer a:hover { color: var(--red); }

@media (max-width: 480px) {
  .login-card { padding: 36px 24px; }
  .input-group input { padding: 14px 16px; font-size: 16px; min-height: 48px; }
  .login-btn { padding: 14px; min-height: 48px; }
}
.login-link { background:none; border:none; color:var(--navy); font-family:inherit; font-size:13px; font-weight:500; cursor:pointer; text-decoration:underline; padding:0; margin-top:14px; }
.login-link:hover { color:var(--red); }
.login-ok { display:none; color:var(--green,#2e7d32); font-size:13px; font-weight:500; margin-top:12px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vip-cloud.js"></script>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <a href="index.html" class="login-logo">Mário <span>Tišťan</span></a>
    <div class="login-badge">VIP Zóna</div>

    <h1 class="login-title">Prihlásenie</h1>
    <p class="login-sub">Prístup len pre autorizovaných členov tímu.</p>

    <form onsubmit="return doLogin()">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="vas@email.sk" autocomplete="username" autofocus required>
      </div>
      <div class="input-group">
        <label for="password">Heslo</label>
        <input type="password" id="password" placeholder="Zadajte heslo" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn">Prihlásiť sa</button>
    </form>

    <div class="login-error" id="loginError">Nesprávne meno alebo heslo.</div>
    <div class="login-ok" id="loginOk"></div>

    <button type="button" class="login-link" onclick="resetPassword()">Zabudnuté heslo?</button>

    <div class="login-footer">
      <a href="index.html">&larr; Späť na hlavnú stránku</a>
    </div>
  </div>
</div>

<script>
// Prihlásenie cez Supabase (e-mail + heslo)
var loginBusy = false;

async function doLogin() {
  if (loginBusy) return false;
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.querySelector('.login-btn');
  var errEl = document.getElementById('loginError');
  var okEl = document.getElementById('loginOk');
  errEl.style.display = 'none';
  okEl.style.display = 'none';

  if (!window.sbc) {
    errEl.textContent = 'Spojenie s cloudom sa nenačítalo. Skontrolujte internet a obnovte stránku.';
    errEl.style.display = 'block';
    return false;
  }

  loginBusy = true;
  btn.disabled = true; btn.style.opacity = '0.6'; btn.style.cursor = 'wait';
  var originalText = btn.textContent;
  btn.textContent = 'Prihlasujem…';

  try {
    var res = await window.sbc.auth.signInWithPassword({ email: email, password: password });
    if (res.error) {
      errEl.textContent = 'Nesprávny e-mail alebo heslo.';
      errEl.style.display = 'block';
      document.getElementById('password').value = '';
    } else {
      window.location.href = 'vip-dashboard.html';
      return false;
    }
  } catch(e) {
    errEl.textContent = 'Chyba pri prihlasovaní: ' + (e.message || e);
    errEl.style.display = 'block';
  } finally {
    loginBusy = false;
    btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = '';
    btn.textContent = originalText;
  }
  return false;
}

// Obnova hesla — pošle e-mail s odkazom na nastavenie nového hesla
async function resetPassword() {
  var email = document.getElementById('email').value.trim();
  var errEl = document.getElementById('loginError');
  var okEl = document.getElementById('loginOk');
  errEl.style.display = 'none';
  okEl.style.display = 'none';
  if (!email) {
    errEl.textContent = 'Najprv zadajte svoj e-mail, potom kliknite na „Zabudnuté heslo".';
    errEl.style.display = 'block';
    return;
  }
  if (!window.sbc) return;
  try {
    var redirectTo = window.location.origin + '/vip-reset.html';
    var res = await window.sbc.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });
    if (res.error) {
      errEl.textContent = 'Nepodarilo sa odoslať e-mail: ' + res.error.message;
      errEl.style.display = 'block';
    } else {
      okEl.textContent = 'Odoslali sme vám e-mail s odkazom na obnovu hesla.';
      okEl.style.display = 'block';
    }
  } catch(e) {
    errEl.textContent = 'Chyba: ' + (e.message || e);
    errEl.style.display = 'block';
  }
}

// Ak je už používateľ prihlásený, presmeruj na dashboard
(async function(){
  try {
    if (window.sbc) {
      var s = await window.sbc.auth.getSession();
      if (s.data.session) window.location.replace('vip-dashboard.html');
    }
  } catch(e) {}
})();
</script>

</body>
</html>
