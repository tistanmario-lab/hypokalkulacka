# Drží free-tier Supabase projekt aktívny.
# Supabase pozastaví free projekt po 7 dňoch nečinnosti databázy — tento workflow
# pošle každý deň jeden ľahký dotaz do databázy, čím sa odpočítavanie nečinnosti resetuje.
#
# Beží na serveroch GitHubu → funguje aj keď je tvoj Mac vypnutý (na rozdiel od launchd).
# Publishable kľúč je verejný (rovnaký ako vo vip-cloud.js) — dáta chráni Row Level Security,
# takže tu nie je potrebný žiadny tajný kľúč/secret.
#
# Dôležité: ping NEPREBUDÍ už pozastavený projekt — len bráni budúcemu pozastaveniu.
# Ak by sa projekt niekedy pozastavil, najprv ho reaktivuj v Supabase dashboarde.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'   # každý deň cca 06:17 UTC (nezaokrúhlená minúta = menšie riziko oneskorenia GitHubom)
  workflow_dispatch: {}      # umožní spustiť ručne z karty Actions (na otestovanie)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" \
            "https://myntuhdvoksykpnxjqgk.supabase.co/rest/v1/aof_analyzy?select=id&limit=1" \
            -H "apikey: sb_publishable_av-jz49vt71NeSq1eqSzDA_KducRdBO")
          echo "Supabase REST odpovedal: HTTP $code"
          case "$code" in
            5*|000|"") echo "::warning::Projekt je pravdepodobne pozastavený alebo nedostupný — reaktivuj ho v Supabase dashboarde."; exit 1 ;;
            *)         echo "Projekt je aktívny — odpočítavanie nečinnosti resetované." ;;
          esac
